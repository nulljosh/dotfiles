<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- dotfiles architecture, in the brand palette (Catppuccin Mocha). Repo files run through install.sh into $HOME;
       secrets stay local; the site is built from brand/ and landing/ and deployed as a Cloudflare Worker. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7f849c"/></marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#1e1e2e"/>
  <rect x="0" y="0" width="240" height="4" fill="#89b4fa"/><rect x="240" y="0" width="240" height="4" fill="#fab387"/>
  <rect x="480" y="0" width="240" height="4" fill="#cba6f7"/><rect x="720" y="0" width="240" height="4" fill="#a6e3a1"/>

  <text x="30" y="48" font-family="-apple-system, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#cdd6f4"><tspan fill="#a6e3a1">.</tspan>dotfiles</text>
  <text x="140" y="48" font-family="-apple-system, Helvetica, sans-serif" font-size="13" fill="#a6adc8">one clone, five symlinks</text>

  <!-- column heads -->
  <g font-size="11" font-weight="600" letter-spacing="1.2">
    <text x="30" y="98" fill="#fab387">REPO</text>
    <text x="470" y="88" text-anchor="middle" fill="#89b4fa">INSTALL.SH</text>
    <text x="620" y="98" fill="#a6e3a1">HOME</text>
  </g>

  <!-- install.sh: every link passes through it -->
  <rect x="360" y="100" width="220" height="246" rx="10" fill="#89b4fa" fill-opacity=".07" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="470" y="334" text-anchor="middle" font-size="11" fill="#89b4fa">ln -s, old file to .bak</text>

  <g font-size="12" fill="#cdd6f4">
    <!-- repo files -->
    <g fill="#181825" stroke="#313244">
      <rect x="30" y="112" width="290" height="34" rx="6"/><rect x="30" y="158" width="290" height="34" rx="6"/>
      <rect x="30" y="204" width="290" height="34" rx="6"/><rect x="30" y="250" width="290" height="34" rx="6"/>
      <rect x="30" y="296" width="290" height="34" rx="6"/>
    </g>
    <text x="44" y="133">zsh/.zshrc</text>
    <text x="44" y="179">fish/config.fish</text>
    <text x="44" y="225">ghostty/config</text>
    <text x="44" y="271">starship/starship.toml</text>
    <text x="44" y="317">starship/starship-terminal.toml</text>

    <!-- targets -->
    <g fill="#181825" stroke="#313244">
      <rect x="620" y="112" width="310" height="34" rx="6"/><rect x="620" y="158" width="310" height="34" rx="6"/>
      <rect x="620" y="204" width="310" height="34" rx="6"/><rect x="620" y="250" width="310" height="34" rx="6"/>
      <rect x="620" y="296" width="310" height="34" rx="6"/>
    </g>
    <text x="634" y="133">~/.zshrc</text>
    <text x="634" y="179">~/.config/fish/config.fish</text>
    <text x="634" y="225">~/.config/ghostty/config</text>
    <text x="634" y="271">~/.config/starship.toml</text>
    <text x="634" y="317">~/.config/starship-terminal.toml</text>
  </g>

  <!-- links -->
  <g stroke="#7f849c" stroke-width="1.5" marker-end="url(#a)">
    <line x1="322" y1="129" x2="614" y2="129"/><line x1="322" y1="175" x2="614" y2="175"/>
    <line x1="322" y1="221" x2="614" y2="221"/><line x1="322" y1="267" x2="614" y2="267"/>
    <line x1="322" y1="313" x2="614" y2="313"/>
  </g>

  <!-- secrets: local only -->
  <g font-size="12">
    <rect x="620" y="364" width="150" height="34" rx="6" fill="none" stroke="#f38ba8" stroke-dasharray="5 4"/>
    <rect x="780" y="364" width="150" height="34" rx="6" fill="none" stroke="#f38ba8" stroke-dasharray="5 4"/>
    <text x="634" y="385" fill="#cdd6f4">secrets.zsh</text>
    <text x="794" y="385" fill="#cdd6f4">secrets.fish</text>
    <text x="620" y="418" font-size="11" fill="#a6adc8">sourced if present, never committed</text>
  </g>

  <!-- the site -->
  <text x="30" y="458" font-size="11" font-weight="600" letter-spacing="1.2" fill="#cba6f7">SITE</text>
  <g font-size="12" fill="#cdd6f4">
    <g fill="#181825" stroke="#313244">
      <rect x="30" y="472" width="190" height="40" rx="6"/><rect x="262" y="472" width="150" height="40" rx="6"/>
      <rect x="454" y="472" width="140" height="40" rx="6"/>
    </g>
    <rect x="636" y="472" width="294" height="40" rx="6" fill="#cba6f7" fill-opacity=".1" stroke="#cba6f7"/>
    <text x="44" y="496">brand/tokens.css</text>
    <text x="276" y="496">landing/</text>
    <text x="468" y="496">deploy.sh</text>
    <text x="650" y="496">dotfiles.jaybulb.com</text>
    <text x="30" y="536" font-size="11" fill="#a6adc8">Dotfiles Sans from scripts/gen_font.py, art from scripts/dither.py; served by a Cloudflare Worker</text>
  </g>
  <g stroke="#7f849c" stroke-width="1.5" marker-end="url(#a)">
    <line x1="222" y1="492" x2="256" y2="492"/><line x1="414" y1="492" x2="448" y2="492"/><line x1="596" y1="492" x2="630" y2="492"/>
  </g>
</svg>
